<title>Simple CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: RTL app shell, white sidebar on the right, soft grey work area with white cards. Status is carried by icons, dots, outlines and text weight, never by filled backgrounds. Brand blue for structure, brand violet as the single accent, the logo gradient used only in thin marks. */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --sunk:#F8F9FC; --line:#E6E8F0; --line2:#D6DAE6; --hover:#F6F7FB;
  --fg:#161E38; --soft:#3E4764; --muted:#687090; --faint:#9CA2B8;
  --navy:#0B3FA8; --navy-hi:#1350CF; --gold:#6424C9; --gold-2:#7C3AED; --purple:#2D1B69;
  --grad:linear-gradient(270deg,#0B47C9 0%,#3A2BD8 55%,#8A22D6 100%);
  --ok:#17804F; --warn:#A8620A; --bad:#C23A33; --info:#2A5CC4; --cus:#6246B8;
  --shadow:0 1px 2px rgba(22,30,56,.05),0 1px 1px rgba(22,30,56,.03);
  --shadow-lg:0 12px 40px rgba(22,30,56,.16);
  --font:"Heebo","Arial Hebrew","Segoe UI",system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--navy)}a:hover{color:var(--navy-hi)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
svg.i{flex-shrink:0;display:block}
#root{min-height:100%}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0 8px}
.logo-full{width:176px;height:auto;display:block}
.brand .tag{font-size:11px;color:var(--faint);letter-spacing:.06em;padding-inline-start:2px}
.side::after{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--grad);opacity:.85}
.qlogo{background:#fff;border-radius:12px;padding:10px 14px;align-self:flex-start}
.qlogo img{width:170px;height:auto;display:block}
.logo{width:38px;height:38px;border-radius:11px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:var(--gold-2);font-weight:800;font-size:17px;flex-shrink:0;position:relative}
.logo::after{content:"";position:absolute;inset:3px;border:1px solid rgba(201,168,76,.45);border-radius:8px}
.brand b{display:block;font-size:15px;letter-spacing:.01em}.brand small{color:var(--muted);font-size:12px}
.navlbl{font-size:11px;color:var(--faint);letter-spacing:.06em;padding:0 12px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:right;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:var(--soft);font-weight:500;cursor:pointer;position:relative}
.nav button .i{color:var(--faint)}
.nav button:hover{background:var(--hover);color:var(--fg)}
.nav button.on{color:var(--fg);font-weight:700;background:transparent}
.nav button.on::before{content:"";position:absolute;right:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad)}
.nav button.on .i{color:var(--gold)}
.nav .cnt{margin-inline-start:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;border:1.5px solid var(--bad);color:var(--bad);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.me{margin-top:auto;padding:10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av.lg{width:58px;height:58px;font-size:22px;border-width:2px}
.av.sq{border-radius:14px}
.av.me-av{border-color:#B9A3F0;color:var(--gold)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top .grow{flex:1;min-width:220px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--fg)}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;width:300px;max-width:100%;position:relative;color:var(--faint)}
.search:focus-within{border-color:var(--line2);background:var(--surface)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--fg)}
.results{position:absolute;top:48px;right:0;left:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:30;overflow:hidden;box-shadow:var(--shadow-lg)}
.results button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:10px 12px;background:transparent;border:0;border-top:1px solid var(--line);cursor:pointer;color:var(--fg)}
.results button:first-child{border-top:0}
.results button:hover{background:var(--hover)}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);border:1px dashed #D9B77A;padding:4px 10px;border-radius:999px;white-space:nowrap}
.content{padding:24px 28px 56px;display:flex;flex-direction:column;gap:20px}
/* buttons */
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--faint);color:var(--fg);box-shadow:var(--shadow)}
.btn .i{color:var(--muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary .i{color:#CFE0FF}
.btn.primary:hover{background:var(--navy-hi);color:#fff}
.btn.wa{color:var(--ok);border-color:#A9D8C0}.btn.wa .i{color:var(--ok)}
.btn.wa:hover{border-color:var(--ok);color:var(--ok)}
.btn.sm{height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.icon{width:36px;padding:0}.btn.icon.sm{width:32px;height:32px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{border-color:var(--line2)}
.btn.danger{color:var(--bad);border-color:#EDB9B5}
.add{height:40px;width:100%;border-radius:10px;border:1px dashed var(--line2);background:transparent;color:var(--navy);font-weight:600;font-size:13px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.add:hover{border-color:var(--navy)}
/* cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h2,.h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.hi{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);flex-shrink:0}
.grid{display:grid;gap:20px;align-items:start}
.g2{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.g2b{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .top-row{display:flex;align-items:center;justify-content:space-between}
.kic{width:36px;height:36px;border-radius:10px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;opacity:.9}
.kpi .v{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.01em}
.kpi .lbl2{font-weight:600;color:var(--soft)}
.pulse{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(194,58,51,.12)}
/* rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600}
.row.link{cursor:pointer;border-radius:10px;margin:0 -8px;padding-inline:8px}
.row.link:hover{background:var(--hover)}
.lbl{width:124px;flex-shrink:0;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.lbl .i{color:var(--faint)}
.meta{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px}
.meta .i{color:var(--faint)}
.meta.bad{color:var(--bad)}.meta.bad .i{color:var(--bad)}
.meta.warn{color:var(--warn)}.meta.warn .i{color:var(--warn)}
/* chips: outline + dot, white ground */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line2);color:var(--soft);background:var(--surface)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.chip.ok{color:var(--ok);border-color:#A9D8C0}.chip.warn{color:var(--warn);border-color:#E7C48E}.chip.bad{color:var(--bad);border-color:#EDB9B5}
.chip.info{color:var(--info);border-color:#B6C8EE}.chip.gold{color:var(--gold);border-color:#D5C2F5}.chip.cus{color:var(--cus);border-color:#CFC4EE;font-size:11px;padding:1px 8px}
.chip.cus::before{display:none}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line2)}
.dots i.on{border-color:var(--ok);background:var(--ok)}
/* form */
.fi{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;color:var(--fg)}
.fi:hover{border-color:var(--line)}
.fi:focus{border-color:var(--navy);background:var(--surface);outline:none;box-shadow:0 0 0 3px rgba(26,43,92,.08)}
.fi::placeholder,.inp::placeholder{color:var(--faint)}
.inp{width:100%;height:42px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:0 12px;color:var(--fg)}
textarea.inp{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(26,43,92,.08)}
.inp[disabled]{background:var(--sunk);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{color:var(--muted);font-size:13px;font-weight:500}
.form{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--navy);flex-shrink:0;cursor:pointer}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pipe div{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px}
.pipe b{font-size:22px;font-weight:800}
.pipe .track{height:4px;border-radius:999px;background:var(--line)}
.pipe .track i{display:block;height:100%;border-radius:999px;background:var(--navy)}
/* stepper */
.steps{display:flex;list-style:none;margin:0;padding:0;overflow-x:auto}
.steps li{flex:1;min-width:92px;position:relative;display:flex;justify-content:center}
.steps li+li::before{content:"";position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--line2)}
.steps li.passed+li::before{background:var(--navy)}
.steps button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;background:transparent;border:0;cursor:pointer;padding:0 4px;color:var(--muted);font-size:12.5px}
.steps .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--faint);transition:border-color .15s}
.steps button:hover .num{border-color:var(--navy)}
.steps .done .num{border-color:var(--navy);background:var(--navy);color:#fff}
.steps .cur .num{border-color:var(--gold-2);color:var(--gold);box-shadow:0 0 0 5px rgba(124,58,237,.14)}
.steps .cur{color:var(--fg);font-weight:700}
.steps .done{color:var(--soft)}
/* next step */
.next{border:1.5px solid var(--gold-2);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;background:var(--surface);box-shadow:var(--shadow)}
.next .ic{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--gold-2);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next small{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.03em}
.next.miss{border-color:var(--bad)}.next.miss .ic{border-color:var(--bad);color:var(--bad)}
/* log timeline */
.tl{position:relative;padding-right:22px}
.tl::before{content:"";position:absolute;right:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:8px 0 12px}
.tl .ev::before{content:"";position:absolute;right:-20px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--faint))}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.check:hover{border-color:var(--line2)}
.check.on{border-color:#A9D8C0}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{display:flex;flex-direction:column;gap:10px;min-height:260px}
.kcol h3{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px;border-bottom:2px solid var(--line)}
.kcol h3 .n{color:var(--muted);font-weight:600}
.kcard{text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--fg);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.kcard:hover{border-color:var(--line2);transform:translateY(-1px)}
.kcard.alert{border-color:#EDB9B5}
.kcard .kf{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* tables */
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-weight:600;color:var(--muted);font-size:12px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--hover)}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs .btn.on{border-color:var(--navy);color:var(--navy);box-shadow:inset 0 -2px 0 var(--navy)}
.tot{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.tot div{display:flex;justify-content:space-between;gap:12px;color:var(--soft)}
.tot .sum{padding-top:10px;border-top:1px dashed var(--line2);font-weight:700;color:var(--fg)}
.tot .sum span:last-child{color:var(--navy);font-size:19px;font-weight:800}
.bubble{margin:0;border:1px solid #A9D8C0;border-radius:14px 14px 4px 14px;padding:12px 14px;color:var(--soft);white-space:pre-wrap;line-height:1.6}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;letter-spacing:.04em}
.ltr{direction:ltr;text-align:right}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.empty{color:var(--faint);padding:10px 0;display:flex;align-items:center;gap:8px}
.stat{display:flex;align-items:center;gap:12px;padding:14px 16px}
.stat .hi{width:36px;height:36px;border-radius:10px}
.stat b{display:block;font-size:17px}
.modal{position:fixed;inset:0;background:rgba(22,30,56,.38);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px;z-index:50;overflow-y:auto}
.modal .box{width:540px;max-width:100%;background:var(--surface);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg)}
.modal h2{font-size:18px;display:flex;align-items:center;gap:10px}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:600;padding:12px 18px;border-radius:12px;z-index:60;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}
.toast .i{color:#C4B5FD}
/* client-facing quote keeps the dark branded look of Simple Solution's quotes */
.qwrap{--surface:#131E40;--sunk:#1A2548;--line:#22305A;--line2:#2A3866;--hover:#1A2548;--fg:#F1EDE3;--soft:#C9CFE0;--muted:#9AA3BF;--faint:#6E7898;--gold:#C9A84C;--navy:#C9A84C;color-scheme:dark;min-height:100vh;background:#070D20;color:var(--fg);display:flex;flex-direction:column;align-items:center}
.qbanner{width:100%;display:flex;align-items:center;gap:12px;justify-content:center;padding:10px 16px;background:#FFFFFF;color:#161E38;font-size:13px;flex-wrap:wrap;border-bottom:1px solid #E6E8F0}
.qbanner .btn{background:#fff;color:#161E38;border-color:#D6DAE6}
.qpage{width:440px;max-width:100%;background:#0F1836;display:flex;flex-direction:column;font-size:15px;flex:1}
.qhead{padding:28px 22px 24px;background:#101A38;border-bottom:1px solid var(--gold);display:flex;flex-direction:column;gap:18px}
.qhead h1{font-size:26px;font-weight:800;line-height:1.3}
.qhead .logo{background:#2D1B69;border:1px solid var(--gold)}
.qbody{padding:24px 22px;display:flex;flex-direction:column;gap:22px}
.qwrap .panel{box-shadow:none}
.qwrap .inp{background:#1A2548}
.qwrap .btn.primary{background:#C9A84C;border-color:#C9A84C;color:#101A38}
.qwrap .tot .sum span:last-child{color:#C9A84C}
.opt{width:100%;text-align:right;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:14px;cursor:pointer;background:#131E40;border:1px solid var(--line2);color:var(--fg)}
.opt.on{background:#1C2240;border:2px solid var(--gold)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #5A6690;flex-shrink:0}
.opt.on .radio{border:6px solid var(--gold)}
.opt .price{color:var(--gold);font-weight:800;font-size:22px}
.sig{position:relative;height:150px;border:1.5px dashed var(--gold);border-radius:12px;background:#0B1330;touch-action:none}
.sig canvas{width:100%;height:100%;display:block;border-radius:12px;cursor:crosshair}
.sig .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--faint);pointer-events:none}
.sig .clr{position:absolute;bottom:8px;left:8px}
.lcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.lcard.disc{border-style:dashed;border-color:#CFC4EE}
.lhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lhead .nm{flex:1;min-width:160px;font-weight:600}
.inp.sm{height:36px;padding:0 10px;font-size:13px}
.num{width:110px}
.litems{display:flex;flex-direction:column;gap:4px;padding-inline-start:26px}
.litem{display:flex;align-items:center;gap:8px}
.litem .fi{padding:3px 6px}
.litem.off .fi{color:var(--faint);text-decoration:line-through}
.pcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pgrid{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:10px}
.phone{border-radius:28px;border:8px solid #1B2440;overflow:hidden;max-width:420px;margin-inline:auto;box-shadow:var(--shadow-lg)}
.phone .qwrap{min-height:0}
.phone .qpage{width:100%}
.tdesc{color:var(--soft);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--navy);border:1px solid #C7D5F5;border-radius:999px;padding:1px 9px;background:var(--surface);cursor:pointer}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2b{grid-template-columns:minmax(0,1fr)}.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:relative;border-left:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .navlbl,.me{display:none}
  .nav{flex-direction:row;overflow-x:auto}.nav button{width:auto;white-space:nowrap}
  .nav button.on::before{right:10px;left:10px;top:auto;bottom:0;width:auto;height:3px}
  .logo-full{width:132px}
  .top{position:static;padding-inline:16px}.content{padding-inline:16px}
  .search{width:100%}
  .form,.checks{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:minmax(0,1fr)}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lbl{width:100px}
  .pgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- dates & format ---------- */
function pad(n){return (n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){var d=new Date(s+"T12:00:00");d.setMonth(d.getMonth()+n);return iso(d)}
function dm(s){if(!s)return "-";var p=s.slice(0,10).split("-");return (+p[2])+"."+(+p[1])}
function dmy(s){if(!s)return "-";var p=s.slice(0,10).split("-");return (+p[2])+"."+(+p[1])+"."+p[0]}
function nowStamp(){var d=new Date();return iso(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function when(s){if(!s)return "";var t=s.slice(11,16);return dm(s)+(t?" · "+t:"")}
function money(n){n=Math.round((+n||0)*100)/100;return n.toLocaleString("he-IL",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" ₪"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function waNum(p){var d=String(p||"").replace(/\D/g,"");if(d.charAt(0)==="0")d="972"+d.slice(1);return d}
function initial(s){return (String(s||"?").trim().charAt(0))||"?"}
function daysAgo(s){var a=new Date(s.slice(0,10)+"T12:00:00"),b=new Date(today()+"T12:00:00");return Math.round((b-a)/864e5)}

function go(view,id){UI.view=view;UI.id=id||null;UI.q="";UI.qtab=0;UI.confirmReset=false;UI.sig=null;UI.agree=false;render();window.scrollTo(0,0)}
var toastT;function toast(msg){var el=document.getElementById("toast");if(el)el.remove();el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");el.innerHTML=ic("check",16)+esc(msg);document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(function(){el.remove()},2600)}

/* ---------- derived ---------- */
function fitScore(l){return FIT.filter(function(f){return l.fit[f[0]]}).length}
function fitDots(n){var s='<span class="dots" aria-label="התאמה '+n+' מתוך 5">';for(var i=0;i<5;i++)s+='<i class="'+(i<n?"on":"")+'"></i>';return s+'</span>'}
function payStatus(p){return p.paid?"שולם":(p.due<today()?"באיחור":"צפוי")}
function mrr(c){return c.services.filter(function(s){return s.status==="פעיל"&&s.billing==="חודשי"}).reduce(function(a,s){return a+(+s.price)},0)}
function optTotals(o){var m=0,one=0,commit=0,dm=0,dO=0;o.lines.forEach(function(l){var v=+l.price||0;if(l.kind==="discount"){if(l.billing==="חודשי")dm+=v;else dO+=v;return}if(l.billing==="חודשי")m+=v;else one+=v;one+=(+l.setup||0);commit=Math.max(commit,+l.commit||0)});m-=dm;one-=dO;var r=D.settings.vat/100;return {m:m,one:one,mv:m*r,onev:one*r,commit:commit,dm:dm,dO:dO}}
function quoteLabel(q){var t=optTotals(q.options[0]);return t.m?money(t.m)+" / חודש":money(t.one)}
function isWaiting(l){return l.stage==="חדש"&&!l.log.some(function(g){return g.by!=="אוטומציה"})}
function activeLead(l){return STAGES.indexOf(l.stage)>-1&&l.stage!=="לקוח"}
function overdueItems(){var t=today();var a=[];D.leads.forEach(function(l){if(activeLead(l)&&l.nextAt&&l.nextAt<t)a.push({kind:"lead",id:l.id,name:l.name,meta:l.next,at:l.nextAt})});D.clients.forEach(function(c){if(c.nextAt&&c.nextAt<t)a.push({kind:"client",id:c.id,name:c.biz,meta:c.next,at:c.nextAt})});return a}
function chip(text,k){return '<span class="chip '+(k||"")+'">'+esc(text)+'</span>'}
function quoteChip(s){return chip(s,{"טיוטה":"","נשלחה":"info","נצפתה":"gold","נחתמה":"ok","נדחתה":"bad","פגה":"warn"}[s])}
function stageChip(s){return chip(s,{"חדש":"bad","נוצר קשר":"warn","כשיר":"gold","פגישה נקבעה":"info","הצעה נשלחה":"info","לקוח":"ok"}[s])}
function clientChip(s){return chip(s,{"בקליטה":"info","פעיל":"ok","בסיכון":"warn","הסתיים":"","עזב":"bad"}[s])}
function payChip(s){return chip(s,{"שולם":"ok","באיחור":"bad","צפוי":"info"}[s])}
function taskCount(){var t=today();return D.tasks.filter(function(x){return !x.done&&x.due<=t}).length}
var TOUCH_IC={"שיחה":["phone","var(--ok)"],"וואטסאפ":["wa","var(--ok)"],"מייל":["mail","var(--info)"],"פגישה":["cal","var(--info)"],"הערה":["note","var(--muted)"],"הצעה נשלחה":["send","var(--info)"],"הצעה נצפתה":["eye","var(--gold-2)"],"הצעה נחתמה":["pen","var(--gold-2)"],"ליד חדש":["inbox","var(--faint)"],"שינוי שלב":["flag","var(--cus)"],"תשלום התקבל":["wallet","var(--ok)"],"חשיפת סיסמה":["key","var(--warn)"],"העתקת סיסמה":["key","var(--warn)"],"גישה נוספה":["lock","var(--navy)"]};
function timeline(log){if(!log.length)return '<div class="empty">'+ic("pulse",16)+'עוד אין נגיעות</div>';
  return '<div class="tl">'+log.map(function(g){var m=TOUCH_IC[g.type]||["pulse","var(--faint)"];
    return '<div class="ev" style="--c:'+m[1]+'"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="color:'+m[1]+'">'+ic(m[0],15)+'</span><b>'+esc(g.type)+'</b><span class="meta">'+ic("clock",13)+when(g.when)+' · '+esc(g.by)+'</span></div><div style="color:var(--soft);margin-top:3px">'+esc(g.text)+'</div></div>'}).join("")+'</div>'}

/* ---------- shell ---------- */
var NAV=[["dash","היום שלי","home"],["leads","לידים","target"],["clients","לקוחות","brief"],["quotes","הצעות מחיר","file"],["tasks","משימות","tasks"],["settings","הגדרות","sliders"]];
function navKey(){var m={lead:"leads",client:"clients",quote:"quotes"};return m[UI.view]||UI.view}
function shell(title,crumb,actions,body){
  var nk=navKey();
  var nav=NAV.map(function(n){var c="";if(n[0]==="tasks"&&taskCount())c='<span class="cnt" aria-label="'+taskCount()+' פתוחות">'+taskCount()+'</span>';if(n[0]==="leads"){var w=D.leads.filter(isWaiting).length;if(w)c='<span class="cnt" aria-label="'+w+' ממתינים">'+w+'</span>'}
    return '<button type="button" class="'+(nk===n[0]?"on":"")+'" data-a="go" data-v="'+n[0]+'"'+(nk===n[0]?' aria-current="page"':'')+'>'+ic(n[2],19)+'<span>'+n[1]+'</span>'+c+'</button>'}).join("");
  var res="";
  if(UI.q.trim()){var q=UI.q.trim();var hits=[];
    D.leads.forEach(function(l){if((l.name+l.biz+l.phone).indexOf(q)>-1&&l.stage!=="לקוח")hits.push('<button type="button" data-a="open" data-k="lead" data-id="'+l.id+'"><span style="color:var(--faint)">'+ic("target",16)+'</span><span><b>'+esc(l.name)+'</b> <span class="sub">ליד · '+esc(l.biz)+'</span></span></button>')});
    D.clients.forEach(function(c){if((c.biz+c.contact+c.phone).indexOf(q)>-1)hits.push('<button type="button" data-a="open" data-k="client" data-id="'+c.id+'"><span style="color:var(--faint)">'+ic("brief",16)+'</span><span><b>'+esc(c.biz)+'</b> <span class="sub">לקוח · '+esc(c.contact)+'</span></span></button>')});
    res='<div class="results">'+(hits.slice(0,6).join("")||'<div class="empty" style="padding:12px">'+ic("search",16)+'לא נמצא ליד או לקוח</div>')+'</div>'}
  return '<div class="app"><aside class="side"><div class="brand"><img class="logo-full" alt="Simple Solutions" src="data:image/png;base64,'+LOGO+'"><span class="tag">מערכת ניהול</span></div><div><div class="navlbl">ניווט</div><nav class="nav" aria-label="ניווט ראשי">'+nav+'</nav></div><div class="me"><div class="av me-av">מ</div><div><b style="display:block">מאור עטייה</b><small class="sub">בעלים</small></div></div></aside>'+
   '<div class="main"><header class="top"><div class="grow">'+(crumb?'<div class="crumb">'+crumb+'</div>':'')+'<h1>'+title+'</h1></div><span class="sample">'+ic("flag",13)+'נתוני דוגמה</span>'+
   '<div class="search">'+ic("search",17)+'<input id="q" type="search" aria-label="חיפוש" placeholder="חיפוש שם, טלפון או עסק" value="'+esc(UI.q)+'" autocomplete="off">'+res+'</div>'+
   (actions||'')+'</header><main class="content">'+body+'</main></div></div><datalist id="inds">'+INDUSTRIES.map(function(x){return '<option value="'+x+'"></option>'}).join('')+'</datalist>'
}

/* ---------- custom fields ---------- */
var FT_IC={text:"tag",url:"link",number:"tag",date:"cal",password:"key"};
function customRows(kind,id,sec,rows){

  }).join("")

  var waiting=D.leads.filter(isWaiting);
  var over=overdueItems();
  var tasksToday=D.tasks.filter(function(x){return !x.done&&x.due<=t});
  var open=D.quotes.filter(function(q){return ["טיוטה","נשלחה","נצפתה"].indexOf(q.status)>-1});
  var totalMrr=D.clients.reduce(function(a,c){return a+mrr(c)},0);
  var activeClients=D.clients.filter(function(c){return ["פעיל","בקליטה","בסיכון"].indexOf(c.status)>-1}).length;
  var lateP=[];D.clients.forEach(function(c){c.payments.forEach(function(p){if(payStatus(p)==="באיחור")lateP.push({c:c,p:p})})});

    kpi("clock","נגיעות באיחור",over.length,"לידים ולקוחות","var(--warn)",over.length>0)+
    kpi("tasks","משימות להיום",tasksToday.length,"כולל משימות באיחור","var(--navy)",false)+
    kpi("trend","הכנסה חודשית חוזרת",money(totalMrr),"לפני מע״מ · "+activeClients+" לקוחות פעילים","var(--gold)",false)+'</div>'+
  '<div class="grid g2"><div class="col">'+
   '<section class="panel">'+head("inbox","ממתינים למגע ראשון",waiting.length?'<span class="meta bad">'+ic("alert",14)+'כל עיכוב עולה כסף היום</span>':'')+
    (waiting.map(function(l){var hrs=l.log[0]?l.log[0].when.slice(11,16):"";return '<div class="row"><div class="av">'+esc(initial(l.name))+'</div><div class="grow"><a href="#" data-a="open" data-k="lead" data-id="'+l.id+'" style="color:var(--fg);text-decoration:none"><b>'+esc(l.name)+'</b></a><span class="meta">'+ic("build",13)+esc(l.biz)+' · '+esc(l.source)+(hrs?' · נכנס ב-'+hrs:'')+'</span></div>'+chip(l.industry,"plain")+
      '<a class="btn icon wa" href="https://wa.me/'+waNum(l.phone)+'" target="_blank" rel="noopener" data-a="waTouch" data-id="'+l.id+'" aria-label="וואטסאפ ל'+esc(l.name)+'">'+ic("wa",18)+'</a><button type="button" class="btn icon" data-a="touch" data-id="'+l.id+'" aria-label="רשום שיחה עם '+esc(l.name)+'">'+ic("phone",17)+'</button></div>'}).join("")||'<div class="empty">'+ic("check",16)+'אין לידים שמחכים</div>')+'</section>'+
   '<section class="panel">'+head("file","הצעות פתוחות",'<button type="button" class="btn sm ghost" data-a="go" data-v="quotes">כל ההצעות'+ic("chev",15)+'</button>')+
    (open.map(function(q){var l=lead(q.leadId)||{};var st=q.status==="נצפתה"?'<span class="meta" style="color:var(--gold)">'+ic("eye",13)+'נפתחה '+q.views+' פעמים</span>':q.status==="נשלחה"?'<span class="meta warn">'+ic("clock",13)+'נשלחה, עוד לא נפתחה</span>':'<span class="meta">'+ic("pen",13)+'טיוטה</span>';
      return '<div class="row link" data-a="open" data-k="quote" data-id="'+q.id+'"><span class="sub" style="width:66px">'+q.no+'</span><div class="grow"><b>'+esc(l.biz||"-")+'</b>'+st+'</div><b style="font-weight:600">'+quoteLabel(q)+'</b>'+quoteChip(q.status)+'</div>'}).join("")||'<div class="empty">'+ic("file",16)+'אין הצעות פתוחות</div>')+'</section>'+
   '<section class="panel">'+head("target","צינור לידים",'<span class="meta">'+ic("money",14)+'ערך צפוי '+money(pipeVal)+'</span>')+
    '<div class="pipe">'+STAGES.map(function(s,i){return '<div><span class="sub">'+s+'</span><b>'+counts[i]+'</b><span class="track"><i style="width:'+Math.round(counts[i]/mx*100)+'%"></i></span></div>'}).join("")+'</div></section>'+
  '</div><div class="col">'+

   '<section class="panel">'+head("repeat","התחייבויות שנגמרות ב-30 יום")+(ren.map(function(x){return '<div class="row link" data-a="open" data-k="client" data-id="'+x.c.id+'"><div class="grow"><b>'+esc(x.c.biz)+'</b><span class="meta">'+ic("cal",13)+esc(x.s.name)+' · מסתיים '+dm(x.s.end)+'</span></div>'+chip("שיחת חידוש","warn")+'</div>'}).join("")||'<div class="empty">'+ic("check",16)+'אין חידושים קרובים</div>')+'</section>'+
  '</div></div>';
  var d=new Date();var days=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];var h=d.getHours();var greet=h<12?"בוקר טוב":h<17?"צהריים טובים":"ערב טוב";
  return shell(greet+", מאור",ic("cal",14)+"יום "+days[d.getDay()]+", "+dmy(today()),'<button type="button" class="btn primary" data-a="newLead">'+ic("plus",17)+'ליד חדש</button>',body)
}
function refName(ref){if(!ref)return "";var p=ref.split(":");if(p[0]==="lead"){var l=lead(p[1]);return l?l.name:""}var c=client(p[1]);return c?c.biz:""}

function vLeads(){
  var cols=[["חדש","inbox"],["נוצר קשר","phone"],["כשיר","star"],["פגישה נקבעה","cal"],["הצעה נשלחה","send"],["לא עכשיו / נפסל","flag"]];

}

function sel(name,opts,val,attrs){return '<select class="fi" '+attrs+' aria-label="'+name+'">'+opts.map(function(o){return '<option'+(o===val?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select>'}
function vLead(id){
  var l=lead(id);if(!l)return vLeads();
  var f=function(p){return 'data-f="lead|'+l.id+'|'+p+'"'};
  var idx=STAGES.indexOf(l.stage);var off=OFF.indexOf(l.stage)>-1;
  var steps='<ol class="steps" aria-label="שלבי ליד">'+STAGES.map(function(s,i){var cls=off?"":(i<idx?"done":i===idx?"cur":"");return '<li class="'+(!off&&i<idx?"passed":"")+'"><button type="button" class="'+cls+'" data-a="stage" data-id="'+l.id+'" data-s="'+s+'"'+(cls==="cur"?' aria-current="step"':'')+'><span class="num">'+(cls==="done"?ic("check",15):(i+1))+'</span>'+s+'</button></li>'}).join("")+'</ol>';
  var dRow=function(icon,label,inner){return '<div class="row"><span class="lbl">'+ic(icon,15)+label+'</span>'+inner+'</div>'};
  var details=dRow("user","שם",'<input class="fi" '+f("name")+' value="'+esc(l.name)+'" aria-label="שם">')+

     '<div class="panel" style="width:100%;text-align:right"><div class="sub" style="margin-bottom:6px">תיעוד חתימה</div><div class="row"><span class="lbl">חתם</span><span>'+esc(q.signed.name)+' · '+esc(q.signed.biz)+'</span></div><div class="row"><span class="lbl">ח.פ / ע.מ</span><span>'+esc(q.signed.idno||"-")+'</span></div><div class="row"><span class="lbl">מועד</span><span>'+when(q.signed.at)+'</span></div>'+(q.signed.sig?'<img alt="החתימה" src="'+q.signed.sig+'" style="background:#0B1330;border-radius:10px;margin-top:8px;width:100%">':'')+'</div></div>';
  } else {

/* ---------- signature pad ---------- */
function initSig(){
  var c=document.getElementById("sigpad");if(!c)return;
  var r=c.getBoundingClientRect();var dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;
  var x=c.getContext("2d");x.scale(dpr,dpr);x.strokeStyle="#F1EDE3";x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";
  var drawing=false,last=null;var hint=document.getElementById("sighint");
  if(UI.sig){var img=new Image();img.onload=function(){x.drawImage(img,0,0,r.width,r.height)};img.src=UI.sig;hint.hidden=true}
  function p(e){var b=c.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}
  c.addEventListener("pointerdown",function(e){drawing=true;last=p(e);c.setPointerCapture(e.pointerId);hint.hidden=true});
  c.addEventListener("pointermove",function(e){if(!drawing)return;var n=p(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(n.x,n.y);x.stroke();last=n});
  function end(){if(!drawing)return;drawing=false;UI.sig=c.toDataURL("image/png")}
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
}

  copyPass:function(d){var c=client(d.c);var v=c.vault.find(function(x){return x.id===d.id});
    var done=function(){addLog(c,"העתקת סיסמה",v.platform,"מאור");save();render();toast("הסיסמה הועתקה")};
    try{navigator.clipboard.writeText(v.pass).then(done,function(){UI.reveal[d.id]=true;render();toast("ההעתקה חסומה כאן, הסיסמה מוצגת")})}catch(e){UI.reveal[d.id]=true;render()}},
  delVault:function(d){var c=client(d.c);c.vault=c.vault.filter(function(x){return x.id!==d.id});save();render()},
  reset:function(){if(!UI.confirmReset){UI.confirmReset=true;render();return}D=seed();save();UI.confirmReset=false;go("dash");toast("נתוני הדוגמה אופסו")}
};

var F={
  newLead:function(v){var l={id:uid(),name:v.name,biz:v.biz,phone:v.phone,email:"",industry:v.industry,source:v.source,campaign:v.campaign||"",budget:"לא אמר",value:0,stage:"חדש",pain:"",next:"",nextAt:"",reason:"",clientId:"",created:today(),
    fit:{market:INDUSTRIES.indexOf(v.industry)<4,active:false,budget:false,decider:false,pain:false},links:{site:"",landing:"",facebook:"",instagram:"",tiktok:"",google:""},custom:{details:[],links:[]},log:[]};
    addLog(l,"ליד חדש","נוסף ידנית","מאור");D.leads.push(l);addTask("מגע ראשון עם "+l.name,today(),"lead:"+l.id,true);UI.modal=null;save();go("lead",l.id);toast("הליד נוסף")},
  touch:function(v){var m=UI.modal;var r=m.kind==="client"?client(m.id):lead(m.id);addLog(r,v.type,v.text);r.next=v.next;r.nextAt=v.nextAt;if(m.kind==="lead"&&r.stage==="חדש")r.stage="נוצר קשר";UI.modal=null;save();render();toast("הנגיעה נרשמה")},
  off:function(v){var l=lead(UI.modal.id);var st=UI.modal.stage;addLog(l,"שינוי שלב",l.stage+" ← "+st+" · "+v.reason);l.stage=st;l.reason=v.reason;if(st==="לא עכשיו"){l.next="לחזור לליד";l.nextAt=v.nextAt}else{l.next="";l.nextAt=""}UI.modal=null;save();render()},
  field:function(v,form){var m=UI.modal;var fd={label:v.label,type:v.type,value:v.value||""};var list=m.kind==="lead"?D.leads:D.clients;
    if(form.querySelector("#fd-all").checked){list.forEach(function(r){r.custom[m.sec].push({label:fd.label,type:fd.type,value:r.id===m.id?fd.value:""})})}else{recOf(m.kind,m.id).custom[m.sec].push(fd)}
    UI.modal=null;save();render();toast("השדה נוסף")},
  vault:function(v){var c=client(UI.modal.id);c.vault.push({id:uid(),platform:v.platform,user:v.user,pass:v.pass||"",note:v.note||"",updated:today()});addLog(c,"גישה נוספה",v.platform);UI.modal=null;save();render();toast("הגישה נשמרה")},
  paid:function(v){var c=client(UI.modal.c);var p=c.payments.find(function(x){return x.id===UI.modal.id});p.paid=true;p.invoice=v.invoice;addLog(c,"תשלום התקבל",p.what+" · "+money(p.amount));if(c.status==="בסיכון"&&!c.payments.some(function(x){return payStatus(x)==="באיחור"}))c.status="פעיל";UI.modal=null;save();render();toast("התשלום סומן")},
  task:function(v){if(v.due<v.start){document.getElementById("tkerr").textContent="תאריך הסיום לפני תאריך ההתחלה.";return}
    if(UI.modal.id){var t=D.tasks.find(function(x){return x.id===UI.modal.id});t.title=v.title;t.desc=v.desc;t.start=v.start;t.due=v.due;t.ref=v.ref;UI.modal=null;save();render();toast("המשימה עודכנה");return}
    addTask(v.title,v.due,v.ref,false,v.desc,v.start);UI.modal=null;save();render();toast("המשימה נוספה")},
  sign:function(v){var q=quote(UI.id);var err=document.getElementById("signerr");
    if(!UI.sig){err.textContent="חסרה חתימה. חתמו בתוך המסגרת.";return}
    if(!document.getElementById("s-agree").checked){err.textContent="יש לסמן שקראתם ואישרתם את התנאים.";return}
    signQuote(q,v)}
};

/* ---------- events ---------- */
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a;if(!A[a])return;
  if(el.tagName==="A"&&(a==="open"||a==="go"))e.preventDefault();
  A[a](el.dataset,el,e)});
document.addEventListener("change",function(e){var el=e.target;
  if(el.dataset&&el.dataset.f){var p=el.dataset.f.split("|");var val=el.type==="checkbox"?el.checked:(el.type==="number"?(el.value===""?0:+el.value):el.value);
    if(p[0]==="catalog"){setPath(D.catalog,p[2],val)}else if(p[0]==="settings"){setPath(D.settings,p[2],val)}else{var r=recOf(p[0],p[1]);if(!r)return;setPath(r,p[2],val);
      if(p[0]==="client"&&p[2].indexOf("onboarding")===0){var all=r.onboarding.every(function(o){return o.done});if(all&&r.status==="בקליטה"){r.status="פעיל";toast("הקליטה הושלמה. הלקוח פעיל")}}}
    save();render()}});
document.addEventListener("input",function(e){if(e.target.id==="q"){UI.q=e.target.value;render()}});
document.addEventListener("change",function(e){if(e.target.id==="pqsel"){UI.pq=e.target.value;render()}});
document.addEventListener("submit",function(e){var f=e.target;if(!f.dataset.form)return;e.preventDefault();var v={};new FormData(f).forEach(function(val,k){v[k]=val});F[f.dataset.form](v,f)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&UI.modal){UI.modal=null;render()}});
render();
})();
</script>
